; ============================================================
;  PS2 XMB Launcher - configuracao
;  Cores: #RRGGBB ou 0xRRGGBB
;  Caminhos relativos (icones/fundo) partem da pasta deste .ini
; ============================================================

[general]
header=PS2 Launcher
; tempo maximo (ms) esperando os dispositivos USB. Nunca trava: depois disso segue.
usb_wait_ms=8000

[theme]
; imagem de fundo PNG (opcional, ideal 640x448). Deixe vazio para so usar o degrade.
background=bg.png
bg_top=#1B2A4A
bg_bottom=#05070F
; escurece o PNG de fundo (0 a 112) - sem custo de desempenho
bg_dim=30
accent=#4FA3FF
text=#FFFFFF
text_dim=#8A93A6
; icones das categorias (32..96) e zoom do selecionado (100..200 %)
icon_size=56
selected_scale=125
; icones dos apps (24..64)
item_size=36
; 1 = ondas animadas no fundo (mais pesado). 0 = desligado (recomendado)
waves=0

; ------------------------------------------------------------
; Categorias = linha horizontal (esquerda/direita)
; Apps = lista vertical dentro da categoria (cima/baixo)
; No app, "category" aceita o nome da categoria ou o numero (1, 2, ...)
;
; mass:/ ou mass*:/  -> procura em TODOS os pendrives/HDs USB
;                       (mass0: ate mass7:), FAT32 e exFAT juntos.
; mass0:/ mass1:/    -> fixa um dispositivo especifico.
; mc0:/ mc1:/        -> memory card.
; Varios caminhos separados por '|' = tenta em ordem (fallback).
; ------------------------------------------------------------

[category1]
title=Jogos
icon=icons/games.png

[category2]
title=Ferramentas
icon=icons/tools.png

[app1]
title=OPL
category=Jogos
path=mass:/OPL/OPNPS2LD.ELF|mass:/OPNPS2LD.ELF|mc0:/APPS/OPL/OPNPS2LD.ELF
icon=icons/opl.png

[app2]
title=Neutrino
category=Jogos
path=mass:/neutrino/neutrino.elf
icon=icons/neutrino.png

[app3]
title=uLaunchELF
category=Ferramentas
path=mass:/APPS/ULE.ELF|mass:/BOOT/BOOT.ELF|mc0:/BOOT/BOOT.ELF
icon=icons/ule.png

[app4]
title=Meu ELF exFAT
category=Ferramentas
path=mass1:/APPS/MEUAPP.ELF
icon=icons/app.png